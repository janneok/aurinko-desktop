# Rakentuu paikallisesta projektista, ilman verkkolähdekoodia.
# Käännöstä varten Flatpak hakee KDE SDK:n ja ajonaikaista käyttöä varten
# KDE Platformin Flathubista, jos niitä ei jo ole koneella.
id: fi.oksanen.Aurinko
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: aurinko-desktop
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
modules:
  - name: aurinko-desktop
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
    sources:
      - type: dir
        path: ..
